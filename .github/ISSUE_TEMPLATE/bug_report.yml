name: Bug report
description: Report a bug in StellarProof
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment (OS, Rust, Node, Stellar CLI versions)
      placeholder: macOS 15, Rust 1.84, Node 20, stellar-cli 23.x
