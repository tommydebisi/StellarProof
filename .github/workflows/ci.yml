name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Build provenance WASM (required by stellarproof contractimport)
        run: cargo build --manifest-path contracts/provenance/Cargo.toml --target wasm32v1-none --release

      - name: Test all contracts
        run: cargo test --workspace

      - name: Build all contract WASM
        run: make -C contracts build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint frontend
        run: pnpm check:frontend

      - name: Test frontend
        run: pnpm test:frontend

      - name: Build frontend
        run: pnpm build:frontend
